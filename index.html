<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuDostup VPN — 360°</title>
<style>
* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}
.stage {
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1100px;
}
.scene {
  position:relative;
  width:min(820px,92vw);
  height:min(560px,78vh);
  display:flex;
  align-items:center;
  justify-content:center;
  perspective:1100px;
}
.logo {
  width:88%;
  max-width:780px;
  display:block;
  transform-style:preserve-3d;
  transform-origin:center center;
  mix-blend-mode:screen;
  filter:drop-shadow(0 0 18px rgba(95,100,255,.35));
  animation:spin 6s cubic-bezier(.55,0,.45,1) infinite;
}
.message {
  position:absolute;
  left:50%;
  bottom:4%;
  transform:translate(-50%,18px) scale(.92);
  opacity:0;
  width:max-content;
  max-width:92vw;
  padding:15px 34px;
  border:2px solid rgba(255,255,255,.8);
  border-radius:999px;
  background:rgba(4,7,20,.9);
  color:#fff;
  font:bold clamp(22px,3.4vw,40px)/1 Arial,sans-serif;
  letter-spacing:1.2px;
  text-align:center;
  white-space:nowrap;
  box-shadow:
    0 0 12px rgba(80,110,255,.9),
    0 0 30px rgba(100,60,255,.45),
    inset 0 0 18px rgba(100,80,255,.2);
  animation:msg 6s ease-in-out infinite;
  z-index:5;
}
.ring {
  position:absolute;
  width:55%;
  aspect-ratio:1;
  border:2px solid rgba(90,110,255,.28);
  border-radius:50%;
  transform:rotateX(70deg);
  box-shadow:0 0 25px rgba(90,80,255,.25);
  opacity:0;
  animation:ring 6s ease-in-out infinite;
}
@keyframes spin {
  0%,12%   { transform:rotateY(0deg) scale(1); }
  22%      { transform:rotateY(90deg) scale(1.02); }
  32%      { transform:rotateY(180deg) scale(1.03); }
  42%      { transform:rotateY(270deg) scale(1.02); }
  52%,100% { transform:rotateY(360deg) scale(1); }
}
@keyframes msg {
  0%,48% { opacity:0; transform:translate(-50%,18px) scale(.92); }
  56%,82% { opacity:1; transform:translate(-50%,0) scale(1); }
  91%,100% { opacity:0; transform:translate(-50%,-12px) scale(.97); }
}
@keyframes ring {
  0%,45% {opacity:0; transform:rotateX(70deg) scale(.75);}
  55%,82% {opacity:.8; transform:rotateX(70deg) scale(1);}
  100% {opacity:0; transform:rotateX(70deg) scale(1.12);}
}
</style>
</head>
